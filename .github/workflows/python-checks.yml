name: Python checks

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile active Python files
        shell: pwsh
        run: |
          python -m compileall -q `
            -x "(^|[\\/])(Lib|Scripts|include|share|etc|archive|data|new_market_data|outputs|__pycache__)([\\/]|$)" `
            .

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests
