name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks and import safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint active Python files
        run: python -m ruff check .

      - name: Compile active Python files
        run: >-
          python -m compileall -q
          -x '(^|[\\/])(Lib|Scripts|include|share|etc|archive|data|new_market_data|outputs|__pycache__)([\\/]|$)'
          .

      - name: Verify macro importer import safety
        run: >-
          python -m unittest
          tests.test_macro_import_service.MacroImportManifestTests.test_all_import_entrypoints_are_import_safe

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run unit tests with coverage
        run: python -m coverage run -m unittest discover -s tests

      - name: Enforce coverage baseline
        run: python -m coverage report

      - name: Build coverage XML
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m coverage xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: error
